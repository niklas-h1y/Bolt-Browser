<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extensions · Bolt Browser</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--line:#293243;--text:#eef2f8;--muted:#9ba8ba;--accent:#b8f36b;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#263246 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(920px,calc(100% - 40px));margin:56px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{font-size:32px;letter-spacing:-.04em;margin:4px 0}.sub{color:var(--muted);margin:0}.button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#17210f}.button:disabled{opacity:.55;cursor:wait}.install-actions{display:flex;gap:8px;flex-wrap:wrap}.button.secondary{background:#293243;color:var(--text);border:1px solid var(--line)}.card{background:linear-gradient(145deg,#1b2230,#151a24);border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0;display:flex;align-items:center;gap:18px}.icon{width:46px;height:46px;border-radius:13px;background:#293746;color:var(--accent);display:grid;place-items:center;font-size:21px;flex:none}.details{min-width:0;flex:1}.name{font-size:16px;font-weight:700}.meta,.description{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.description{font-size:13px;margin-top:5px}.remove{background:#35242a;color:#ffaaaa;border:1px solid #55313a;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:650}.empty{border:1px dashed #3a4659;border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}.status{min-height:24px;color:var(--muted);font-size:13px;margin-top:16px}.hint{margin-top:30px;color:var(--muted);font-size:12px}
@media(max-width:600px){main{margin:30px auto}.top{align-items:flex-start;flex-direction:column}.card{align-items:flex-start;flex-wrap:wrap}.remove{margin-left:64px}}
</style></head>
<body><main>
<header class="top"><div><div class="eyebrow">Bolt Browser</div><h1>Extensions</h1><p class="sub">Manage your installed Chromium extensions.</p></div><div class="install-actions"><button class="button" id="load">＋ &nbsp;Load unpacked</button><button class="button secondary" id="installCrx">Install .crx / Web Store URL</button></div></header>
<section id="list" aria-live="polite"></section><div class="status" id="status" role="status"></div>
<p class="hint">Only install extensions from sources you trust. Extensions can access websites and data according to the permissions declared in their manifest.</p>
</main>
<script>
const list=document.getElementById('list'),status=document.getElementById('status'),load=document.getElementById('load'),installCrx=document.getElementById('installCrx');
function message(text){status.textContent=text}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){
  try{
    const extensions=await window.boltExtensions.list();
    if(!extensions.length){list.innerHTML='<div class="empty"><strong>No extensions installed</strong>Load an unpacked Manifest V3 extension folder to get started.</div>';return}
    list.innerHTML=extensions.map(ext=>'<article class="card"><div class="icon">◇</div><div class="details"><div class="name">'+escapeHtml(ext.name)+'</div><div class="meta">Version '+escapeHtml(ext.version)+' · '+escapeHtml(ext.id)+'</div><div class="description">'+escapeHtml(ext.description||'No description provided.')+'</div></div><button class="remove" data-id="'+escapeHtml(ext.id)+'">Remove</button></article>').join('');
    list.querySelectorAll('.remove').forEach(button=>button.addEventListener('click',async()=>{
      if(!confirm('Remove this extension from Bolt Browser?'))return;
      button.disabled=true;
      try{await window.boltExtensions.remove(button.dataset.id);message('Extension removed.');await refresh()}
      catch(error){message(error.message);button.disabled=false}
    }));
  }catch(error){list.innerHTML='<div class="empty"><strong>Could not load extensions</strong>'+escapeHtml(error.message)+'</div>'}
}
load.addEventListener('click',async()=>{
  load.disabled=true;message('Choose a folder containing manifest.json…');
  try{const result=await window.boltExtensions.installUnpacked();if(result?.canceled)message('Selection canceled.');else message('Extension loaded successfully.');await refresh()}
  catch(error){message(error.message)}
  finally{load.disabled=false}
});
installCrx.addEventListener('click',async()=>{installCrx.disabled=true;try{const input=prompt('Paste a Chrome Web Store URL or 32-character extension ID. Choose Cancel or leave it empty to select a local .crx file.');if(input===null)return;const result=input.trim()?await window.boltExtensions.installCrxUrl(input.trim()):await window.boltExtensions.installCrxFile();if(result?.canceled)message('Installation canceled.');else message('Extension installed: '+result.name);await refresh()}catch(error){message(error.message)}finally{installCrx.disabled=false}});
refresh();
</script></body></html>
