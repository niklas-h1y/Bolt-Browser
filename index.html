<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolt Browser</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#181e29;--panel2:#222b3a;--line:#303a4c;--text:#edf2fa;--muted:#96a2b5;--green:#00e676}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,sans-serif;overflow:hidden}.top{height:116px;background:#151a24;border-bottom:1px solid var(--line);padding:8px 12px 0}.brand{height:24px;display:flex;align-items:center;gap:8px;font-weight:750}.bolt{display:grid;place-items:center;background:var(--green);color:#06140c;width:19px;height:19px;border-radius:6px}.tabs{height:34px;display:flex;align-items:end;gap:5px;overflow:auto}.tab{height:30px;min-width:120px;max-width:210px;padding:0 10px;background:transparent;color:var(--muted);border-radius:8px 8px 0 0;display:flex;align-items:center;gap:8px}.tab.active{background:var(--bg);color:var(--text);border:1px solid var(--line);border-bottom-color:var(--bg)}.tabtitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}.x{opacity:.6;font-size:17px}.new{height:27px;width:29px;background:transparent;color:var(--muted);font-size:20px}.toolbar{height:44px;display:flex;align-items:center;gap:5px}.btn{height:32px;min-width:32px;padding:0 9px;background:transparent;color:var(--muted);border-radius:8px;font-size:16px}.btn:hover,.tab:hover{background:var(--panel2);color:var(--text)}.btn:disabled{opacity:.3}.address{height:34px;display:flex;align-items:center;gap:8px;background:#222b3a;border:1px solid #354155;border-radius:10px;padding:0 10px;flex:1}.address input{background:none;border:0;outline:0;color:var(--text);width:100%;font-size:13px}.go{height:30px;padding:0 14px;background:var(--green);color:#06140c;font-weight:750;border-radius:8px}.right{position:relative}.popover{display:none;position:absolute;z-index:10;right:0;top:37px;width:245px;background:#202938;border:1px solid #3a4659;border-radius:12px;padding:8px;box-shadow:0 18px 55px #0008}.popover.open{display:block}.popover button{width:100%;padding:10px;text-align:left;color:var(--text);background:none;border-radius:7px}.popover button:hover{background:#ffffff12}.modalback{display:none;position:fixed;inset:0;z-index:20;background:#0009;align-items:center;justify-content:center}.modalback.open{display:flex}.modal{width:min(540px,calc(100% - 30px));max-height:80vh;overflow:auto;background:#1a2230;border:1px solid #3a4659;border-radius:16px;padding:20px;box-shadow:0 25px 80px #0009}.modal h2{margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.extrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.primary{background:var(--green);color:#06140c;padding:10px 14px;border-radius:9px;font-weight:700}.secondary{background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:9px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.status{position:fixed;bottom:0;height:24px;background:#151a24;border-top:1px solid var(--line);width:100%;padding:4px 12px;color:#8390a4;font-size:10px;display:flex;justify-content:space-between}
</style></head><body>
<header class="top"><div class="brand"><span class="bolt">⚡</span> Bolt Browser <span style="font-size:10px;color:#8794a8;font-weight:400">CHROMIUM</span></div>
<div class="tabs" id="tabs"></div>
<div class="toolbar"><button class="btn" id="back" title="Back">←</button><button class="btn" id="forward" title="Forward">→</button><button class="btn" id="reload" title="Reload">↻</button><button class="btn" id="home" title="New tab">⌂</button>
<form class="address" id="addressForm"><span style="color:var(--green)">⌕</span><input id="address" placeholder="Search or enter a website address" autocomplete="off" spellcheck="false"></form><button class="go" type="submit" form="addressForm">Go</button>
<div class="right"><button class="btn" id="menuBtn" title="Bolt menu">⋮</button><div class="popover" id="menu"><button id="extensions">🧩 &nbsp; Extensions</button><button id="downloads">⬇ &nbsp; Open downloads folder</button><button id="newTab">＋ &nbsp; New tab</button><button id="about">⚡ &nbsp; About Bolt Browser</button></div></div></div></header>
<div class="status"><span id="status">Ready · Chromium engine</span><span>⚡ BOLT</span></div>
<div class="modalback" id="modalback"><section class="modal"><h2>🧩 Extensions</h2><p class="muted">Load unpacked Chromium extensions from a local folder containing manifest.json. Only install extensions you trust.</p><div id="extensionList"><p class="muted">Loading extensions…</p></div><div class="actions"><button class="secondary" id="done">Close</button><button class="primary" id="install">＋ Load unpacked extension</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let current=null,tabs=[];
const invoke=window.bolt;
function renderTabs(){const root=$('#tabs');root.innerHTML='';tabs.forEach(t=>{const b=document.createElement('button');b.className='tab'+(t.active?' active':'');const title=document.createElement('span');title.className='tabtitle';title.textContent=t.title||'New tab';const close=document.createElement('span');close.className='x';close.textContent='×';close.onclick=e=>{e.stopPropagation();invoke.closeTab(t.id)};b.append(title,close);b.onclick=()=>invoke.activateTab(t.id);root.append(b)});const n=document.createElement('button');n.className='new';n.textContent='+';n.title='New tab';n.onclick=()=>invoke.newTab();root.append(n)}
function pageState(s){current=s.id;$('#address').value=s.url||'';$('#back').disabled=!s.canGoBack;$('#forward').disabled=!s.canGoForward;$('#status').textContent=s.title||'Ready'}
invoke.on('tabs-updated',v=>{tabs=v;renderTabs()});invoke.on('page-state',pageState);invoke.on('navigation-started',v=>{if(v.id===current)$('#status').textContent='Loading…'});invoke.on('browser-error',v=>$('#status').textContent=v.message);invoke.on('download-started',v=>$('#status').textContent='Downloading '+v.filename);invoke.on('download-finished',v=>$('#status').textContent='Download '+v.state+': '+v.filename);
$('#addressForm').onsubmit=e=>{e.preventDefault();invoke.navigate($('#address').value);$('#address').blur()};$('#back').onclick=()=>invoke.back();$('#forward').onclick=()=>invoke.forward();$('#reload').onclick=()=>invoke.reload();$('#home').onclick=()=>invoke.newTab();$('#newTab').onclick=()=>{closeMenu();invoke.newTab()};$('#menuBtn').onclick=()=>$('#menu').classList.toggle('open');function closeMenu(){$('#menu').classList.remove('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.right'))closeMenu()});$('#downloads').onclick=()=>{closeMenu();invoke.openDownloads()};$('#about').onclick=()=>{closeMenu();$('#status').textContent='Bolt Browser · Chromium-powered desktop browser'};
$('#extensions').onclick=()=>{closeMenu();$('#modalback').classList.add('open');refreshExtensions()};$('#done').onclick=()=>$('#modalback').classList.remove('open');$('#modalback').onclick=e=>{if(e.target.id==='modalback')$('#modalback').classList.remove('open')};
async function refreshExtensions(){const list=$('#extensionList');try{const exts=await invoke.listExtensions();list.innerHTML='';if(!exts.length){list.innerHTML='<p class="muted">No extensions installed yet.</p>';return}exts.forEach(ext=>{const row=document.createElement('div');row.className='extrow';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=ext.name;const version=document.createElement('div');version.className='muted';version.textContent='Version '+ext.version;info.append(name,version);const remove=document.createElement('button');remove.className='secondary';remove.textContent='Remove';remove.onclick=async()=>{await invoke.removeExtension(ext.id);refreshExtensions()};row.append(info,remove);list.append(row)})}catch(e){list.textContent=e.message}}
$('#install').onclick=async()=>{try{const ext=await invoke.installExtension();if(!ext.canceled)refreshExtensions()}catch(e){alert('Could not load extension: '+e.message)}};
document.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='l'){e.preventDefault();$('#address').focus();$('#address').select()}if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();invoke.newTab()}if(mod&&e.key.toLowerCase()==='w'){e.preventDefault();if(current)invoke.closeTab(current)}if(mod&&e.key.toLowerCase()==='r'){e.preventDefault();invoke.reload()}if(e.key==='Escape')closeMenu()});
</script></body></html>
