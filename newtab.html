<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New tab · Bolt</title><style>:root{color-scheme:dark;--bg:#111210;--panel:#191b18;--line:#30342d;--text:#f2f4ed;--muted:#92988c;--accent:#b8f36b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif;display:grid;place-items:center}.wrap{text-align:center;width:min(620px,90%);transform:translateY(-4vh)}.brand{display:flex;align-items:center;justify-content:center;gap:9px;font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:42px}.bolt{width:48px;height:48px;border-radius:15px;background:var(--accent);color:#17200d;display:grid;place-items:center;font-size:28px;margin:0 auto 24px}h1{font-size:clamp(36px,7vw,56px);letter-spacing:-2.8px;margin:0 0 10px;font-weight:650}.muted{color:var(--muted)}form{display:flex;gap:8px;background:var(--panel);padding:7px;border:1px solid var(--line);border-radius:13px;margin:30px 0 22px;transition:border .2s}form:focus-within{border-color:var(--accent)}input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);padding:11px;font-size:14px}button{background:var(--accent);color:#17200d;border:0;border-radius:9px;padding:0 18px;font-weight:750}.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.links a{color:var(--muted);border:1px solid var(--line);text-decoration:none;padding:10px 14px;border-radius:9px;font-size:12px;transition:.15s}.links a:hover{color:var(--text);border-color:var(--accent)}.foot{position:fixed;bottom:24px;left:0;right:0;text-align:center;color:#62695d;font-size:10px;letter-spacing:1.8px}</style></head><body><main class="wrap"><div class="brand">BOLT BROWSER</div><div class="bolt">ϟ</div><h1>Make room for <span style="color:var(--accent)">curiosity.</span></h1><p class="muted">A quieter place to start exploring.</p><form id="search"><input id="q" placeholder="Search or enter a website address…" autocomplete="off" autofocus><button>Search</button></form><nav class="links"><a href="https://www.google.com">Google</a><a href="https://www.youtube.com">YouTube</a><a href="https://www.wikipedia.org">Wikipedia</a><a href="https://github.com">GitHub</a></nav></main><div class="foot">LESS CLUTTER. MORE WEB.</div><script>const prefs=(()=>{try{return JSON.parse(localStorage.getItem('bolt-settings')||'{}')}catch{return{}}})();if(prefs.theme==='light'){document.documentElement.style.colorScheme='light';document.documentElement.style.setProperty('--bg','#f6f7f3');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--line','#dfe3d8');document.documentElement.style.setProperty('--text','#20251d');document.documentElement.style.setProperty('--muted','#747c6c')}if(prefs.accent)document.documentElement.style.setProperty('--accent',prefs.accent);document.querySelector('#search').onsubmit=e=>{e.preventDefault();const v=document.querySelector('#q').value.trim();if(!v)return;const url=(v.startsWith('http://')||v.startsWith('https://')||/^[a-z0-9-]+([.][a-z0-9-]+)+/i.test(v))?(v.startsWith('http')?v:'https://'+v):({google:'https://www.google.com/search?q=',duckduckgo:'https://duckduckgo.com/?q=',bing:'https://www.bing.com/search?q='}[prefs.searchEngine||'google']+encodeURIComponent(v));location.href=url}</script></body></html>
