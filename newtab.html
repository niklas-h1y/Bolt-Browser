<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New tab · Bolt</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#173126,#10131b 60%);color:#edf2fa;font:15px system-ui;display:grid;place-items:center}.wrap{text-align:center;width:min(620px,90%)}.bolt{margin:auto auto 20px;width:64px;height:64px;border-radius:20px;background:#00e676;color:#06140c;display:grid;place-items:center;font-size:38px}.muted{color:#96a2b5}form{display:flex;gap:8px;background:#222b3a;padding:7px;border:1px solid #354155;border-radius:14px;margin:28px 0}input{flex:1;min-width:0;background:none;border:0;outline:0;color:white;padding:10px;font-size:15px}button{background:#00e676;color:#06140c;border:0;border-radius:9px;padding:0 18px;font-weight:750}.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.links a{color:#cbd5e1;background:#ffffff0b;text-decoration:none;padding:12px 16px;border-radius:10px}</style></head><body><main class="wrap"><div class="bolt">⚡</div><h1>Go your own way.</h1><p class="muted">A clean place to start exploring the web.</p><form id="search"><input id="q" placeholder="Search the web or enter an address…" autofocus><button>Search</button></form><nav class="links"><a href="https://www.google.com">Google</a><a href="https://www.youtube.com">YouTube</a><a href="https://www.wikipedia.org">Wikipedia</a><a href="https://github.com">GitHub</a></nav></main><script>document.querySelector('#search').onsubmit=e=>{e.preventDefault();const v=document.querySelector('#q').value.trim();if(v)location.href=/^(https?:\\/\\/|[\\w-]+(\\.[\\w-]+)+)/i.test(v)?(v.startsWith('http')?v:'https://'+v):'https://www.google.com/search?q='+encodeURIComponent(v)}</script></body></html>
