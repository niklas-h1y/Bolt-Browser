<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111210"><title>New tab · Bolt</title>
<style>
 :root{color-scheme:dark;--bg:#111210;--panel:#191b18;--line:#30342d;--text:#f2f4ed;--muted:#92988c;--accent:#b8f36b;--accent-ink:#17200d}
:root[data-theme="midnight-neon"]{color-scheme:dark;--bg:#090b18;--panel:#11152a;--line:#2b3562;--text:#edf3ff;--muted:#98a6ca;--accent:#8bd5ff;--accent-ink:#10202a}
:root[data-theme="oled-black"]{color-scheme:dark;--bg:#000;--panel:#080808;--line:#292929;--text:#f5f5f5;--muted:#a0a0a0;--accent:#b8f36b;--accent-ink:#101010}
:root[data-theme="clean-light"]{color-scheme:light;--bg:#f6f7f3;--panel:#fff;--line:#dfe3d8;--text:#20251d;--muted:#747c6c;--accent-ink:#17200d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;transition:background .2s,color .2s}
header{height:64px;padding:0 34px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.1px}.mark{width:25px;height:25px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px}.header-note{color:var(--muted);font-size:11px;letter-spacing:1.5px}
main{width:min(680px,calc(100% - 36px));margin:auto;text-align:center;padding:55px 0 90px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:18px}.clock{font-size:clamp(38px,8vw,58px);font-weight:600;letter-spacing:-3px;line-height:1.05;font-variant-numeric:tabular-nums}.date{margin-top:10px;color:var(--muted);font-size:13px}.headline{font-size:clamp(28px,5vw,39px);letter-spacing:-1.8px;font-weight:550;margin:38px 0 8px}.headline span{color:var(--accent)}.sub{color:var(--muted);margin:0 0 28px}
form{height:58px;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 17px;background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:border .2s,box-shadow .2s}form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}.search-icon{font-size:19px;color:var(--muted)}input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}input::placeholder{color:var(--muted)}form button{height:42px;padding:0 17px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:35px 2px 12px;text-align:left}.section-head strong{font-size:12px;font-weight:650}.section-head span{font-size:11px;color:var(--muted)}.links{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.link{min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);border-radius:12px;color:var(--text);text-decoration:none;background:transparent;transition:.16s}.link:hover{background:var(--panel);border-color:var(--accent);transform:translateY(-2px)}.favicon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel);font-size:13px;font-weight:700}.link small{font-size:11px;color:var(--muted)}
footer{display:flex;justify-content:center;gap:8px;padding:18px;color:var(--muted);font-size:10px;letter-spacing:1.4px}.dot{color:var(--accent)}
@media(max-width:520px){header{padding:0 18px}.header-note{display:none}.links{grid-template-columns:repeat(2,1fr)}main{padding:35px 0 60px}.headline{margin-top:30px}}
</style></head>
<body>
<header><div class="brand"><span class="mark">ϟ</span><span>Bolt</span></div><div class="header-note">A QUIETER PLACE TO EXPLORE</div></header>
<main>
<div class="eyebrow">Your browser, your space</div><div class="clock" id="clock">09:41</div><div class="date" id="date"></div>
<h1 class="headline">Make room for <span>curiosity.</span></h1><p class="sub">Where would you like to go?</p>
<form id="search"><span class="search-icon">⌕</span><input id="query" type="text" placeholder="Search or enter a website address…" autocomplete="off" autofocus><button type="submit">Search ↗</button></form>
<div class="section-head"><strong>Quick access</strong><span>Your everyday places</span></div>
<nav class="links" aria-label="Quick links">
<a class="link" href="https://www.google.com"><span class="favicon">G</span><small>Google</small></a>
<a class="link" href="https://www.youtube.com"><span class="favicon">▶</span><small>YouTube</small></a>
<a class="link" href="https://www.wikipedia.org"><span class="favicon">W</span><small>Wikipedia</small></a>
<a class="link" href="https://github.com"><span class="favicon">⌘</span><small>GitHub</small></a>
</nav>
</main>
<footer><span>LESS CLUTTER</span><span class="dot">·</span><span>MORE WEB</span></footer>
<script>
const $=s=>document.querySelector(s);
let prefs={};try{prefs=JSON.parse(localStorage.getItem('bolt-settings')||'{}')}catch{}
function applyThemePrefs(saved){const merged={...prefs,...(saved||{})};const legacy={dark:'bolt-dark',light:'clean-light',system:'bolt-dark'};const theme=legacy[merged.theme]||merged.theme||'bolt-dark';document.documentElement.dataset.theme=theme;if(merged.accent)document.documentElement.style.setProperty('--accent',merged.accent);document.documentElement.style.setProperty('--accent-ink',merged.accent==='#8bd5ff'?'#10202a':merged.accent==='#d3a6ff'?'#241331':merged.accent==='#ffb58a'?'#2a170d':'#17200d');prefs=merged}
applyThemePrefs(prefs);if(window.bolt?.getUiSettings)window.bolt.getUiSettings().then(applyThemePrefs).catch(()=>{});if(window.bolt?.on)window.bolt.on('ui-settings-updated',applyThemePrefs);
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'})}tick();setInterval(tick,15000);
$('#search').addEventListener('submit',e=>{e.preventDefault();const q=$('#query').value.trim();if(!q)return;const isUrl=/^(https?:\/\/|file:|about:)/i.test(q)||/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(q)||/^localhost(:\d+)?/.test(q);const engines={google:'https://www.google.com/search?q=',duckduckgo:'https://duckduckgo.com/?q=',bing:'https://www.bing.com/search?q='};location.href=isUrl?( /^(https?:|file:|about:)/i.test(q)?q:'https://'+q):(engines[prefs.searchEngine||'google']+encodeURIComponent(q))});
</script></body></html>
