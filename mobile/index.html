<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><meta name="description" content="Bolt Browser mobile — a fast starting point for the web."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../icon.svg" type="image/svg+xml"><title>Bolt Browser Mobile</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#1b2330;--line:#303a4c;--text:#edf2fa;--muted:#9aa6b8;--green:#00e676}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;min-height:100dvh}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom)}header{position:sticky;top:0;z-index:5;min-height:66px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);background:var(--bg);padding:8px 0}.logo{flex:0 0 32px;width:32px;height:32px;border-radius:10px;background:var(--green);color:#06140c;display:grid;place-items:center;font-size:21px;font-weight:900}.address{height:44px;min-width:0;flex:1;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid #39465a;border-radius:24px;padding:4px 6px 4px 12px}.lock{font-size:13px;color:var(--green)}.address input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:14px system-ui}.address input::placeholder{color:var(--muted)}.go{height:34px;min-width:38px;border:0;border-radius:18px;background:var(--green);color:#06140c;font-weight:800}.menu{height:40px;width:34px;border:0;background:transparent;color:var(--text);font-size:23px}.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 0}.hero{text-align:center;margin-bottom:30px}.heroicon{width:66px;height:66px;border-radius:22px;background:var(--green);color:#06140c;display:grid;place-items:center;font-size:39px;margin:0 auto 20px;box-shadow:0 12px 45px #00e67630}h1{font-size:clamp(34px,9vw,50px);letter-spacing:-1.8px;margin:0 0 8px}.green{color:var(--green)}.muted{color:var(--muted);line-height:1.5}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.shortcut{background:#ffffff09;color:var(--text);border:1px solid #ffffff0c;border-radius:12px;padding:14px 4px;text-align:center;text-decoration:none;font-size:12px}.shortcut b{display:block;font-size:18px;margin-bottom:5px}.actions{display:flex;gap:10px;margin-top:24px}.actions button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}.notice{font-size:11px;text-align:center;color:#758196;margin-top:25px}.recent{margin-top:25px}.recent h2{font-size:14px}.recent button{display:block;width:100%;text-align:left;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.foot{padding:12px 0;text-align:center;color:#748095;font-size:10px;border-top:1px solid var(--line)}@media(min-width:600px){.app{padding-left:28px;padding-right:28px}.content{padding-bottom:70px}}
</style></head><body><div class="app">
<header><span class="logo">⚡</span><form class="address" id="search"><span class="lock">⌕</span><input id="query" type="text" placeholder="Search or enter address" autocomplete="off" enterkeyhint="go" aria-label="Search or enter website"><button class="go" aria-label="Go">Go</button></form><button class="menu" id="menu" aria-label="Menu">⋮</button></header>
<main class="content"><section class="hero"><div class="heroicon">⚡</div><h1>Go your own <span class="green">way.</span></h1><p class="muted">Your web, one tap away.</p></section>
<nav class="shortcuts"><a class="shortcut" href="https://www.google.com" target="_blank" rel="noopener noreferrer"><b>G</b>Google</a><a class="shortcut" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer"><b>▶</b>YouTube</a><a class="shortcut" href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer"><b>W</b>Wikipedia</a><a class="shortcut" href="https://github.com" target="_blank" rel="noopener noreferrer"><b>⌘</b>GitHub</a></nav>
<div class="actions"><button id="install" hidden>＋ Install Bolt</button><button id="bookmark">☆ Save this page</button><button id="saved">★ Saved pages</button></div>
<section class="recent" id="recent" hidden><h2>Saved pages</h2><div id="savedList"></div></section>
<p class="notice">Hosted mobile start page · websites open in your device browser</p></main><footer class="foot">⚡ BOLT BROWSER</footer></div>
<script>
const $=s=>document.querySelector(s);let deferredPrompt=null;const getSaved=()=>{try{return JSON.parse(localStorage.getItem('bolt-mobile-saved')||'[]')}catch{return[]}};
function resolve(q){q=q.trim();if(!q)return null;if(/^(https?:\/\/|about:)/i.test(q))return q;if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(q)||/^localhost(:\d+)?/.test(q))return 'https://'+q;return 'https://www.google.com/search?q='+encodeURIComponent(q)}
$('#search').onsubmit=e=>{e.preventDefault();const url=resolve($('#query').value);if(url){localStorage.setItem('bolt-mobile-last',url);window.open(url,'_blank','noopener,noreferrer')}};
$('#menu').onclick=()=>{const choices=['Save last address','Show saved pages','Install Bolt'];const pick=prompt('Bolt menu\n1. Save last address\n2. Show saved pages\n3. Install Bolt\n\nEnter 1, 2 or 3');if(pick==='1')$('#bookmark').click();if(pick==='2')$('#saved').click();if(pick==='3'&&!$('#install').hidden)$('#install').click()};
$('#bookmark').onclick=()=>{const url=localStorage.getItem('bolt-mobile-last');if(!url){alert('Search for a page first, then save its address.');return}const list=getSaved();if(!list.includes(url))list.unshift(url);localStorage.setItem('bolt-mobile-saved',JSON.stringify(list.slice(0,50)));alert('Saved to Bolt.');};
$('#saved').onclick=()=>{const list=getSaved();$('#recent').hidden=!$('#recent').hidden;$('#savedList').innerHTML='';list.forEach(url=>{const b=document.createElement('button');b.textContent=url;b.onclick=()=>window.open(url,'_blank','noopener,noreferrer');$('#savedList').append(b)});};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#install').hidden=true};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
