plugins { id 'com.android.application' }

android {
    namespace 'com.bolt.browser'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bolt.browser'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // latest.release resolves the newest stable GeckoView published by Mozilla.
    implementation 'org.mozilla.geckoview:geckoview:latest.release'
}
