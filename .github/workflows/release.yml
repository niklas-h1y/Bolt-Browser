name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows updater release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build extension action preload
        run: npm run build:preload

      - name: Check JavaScript syntax
        run: node --check main.js && node --check preload.js && node --check preload.bundle.js && node --check permissions.js

      - name: Build and publish installer plus update metadata
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
