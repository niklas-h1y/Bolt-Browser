name: Windows installer

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows setup
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build extension action preload
        run: npm run build:preload

      - name: Check JavaScript syntax
        run: node --check main.js && node --check preload.js && node --check preload.bundle.js && node --check permissions.js

      - name: Build installer
        run: npm run dist:win -- --publish never

      - name: Upload setup file
        uses: actions/upload-artifact@v4
        with:
          name: Bolt-Browser-Windows-Setup
          path: dist/Bolt-Browser-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
